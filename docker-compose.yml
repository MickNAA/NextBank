services:
  postgres:
    image: postgres:16-alpine
    container_name: nexbank-postgres
    environment:
      POSTGRES_DB: nexbank
      POSTGRES_USER: nexbank
      POSTGRES_PASSWORD: nexbank123
    ports:
      - "5433:5433"
    volumes:
      - nexbank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexbank"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nexbank_pgdata: